<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgentID Demo · Monad Metropolis</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #111821;
    --border: #1e2a38;
    --text: #e6edf3;
    --muted: #8b9bb0;
    --green: #3dd68c;
    --cyan: #5cc8ff;
    --amber: #ffc14a;
    --pink: #ff7ab2;
    --dim: #4a5a6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "DejaVu Sans Mono", "Liberation Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background:
      radial-gradient(ellipse at 20% 0%, #132033 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, #0f1a14 0%, transparent 45%),
      var(--bg);
  }
  .wrap {
    width: min(1100px, 100%);
  }
  .titlebar {
    text-align: center;
    margin-bottom: 18px;
  }
  .titlebar h1 {
    font-size: clamp(28px, 4vw, 42px);
    letter-spacing: 0.04em;
    font-weight: 700;
    color: var(--cyan);
  }
  .titlebar .sub {
    margin-top: 8px;
    font-size: clamp(14px, 2vw, 18px);
    color: var(--muted);
    line-height: 1.5;
  }
  .badge {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 12px;
    border: 1px solid var(--amber);
    color: var(--amber);
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 0.08em;
  }
  .terminal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    overflow: hidden;
  }
  .chrome {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #0d131a;
    border-bottom: 1px solid var(--border);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .chrome .path {
    margin-left: 10px;
    color: var(--dim);
    font-size: 13px;
  }
  .screen {
    padding: 22px 26px 28px;
    min-height: 480px;
    font-size: clamp(15px, 1.7vw, 18px);
    line-height: 1.55;
  }
  .line { white-space: pre-wrap; word-break: break-all; opacity: 0; }
  .line.show { opacity: 1; transition: opacity 0.15s ease; }
  .line.banner { color: var(--dim); }
  .line.header { color: var(--cyan); font-weight: 700; }
  .line.meta { color: var(--muted); }
  .line.key { color: var(--text); }
  .line.ok { color: var(--green); font-weight: 700; }
  .line.hl { color: var(--amber); }
  .line.pink { color: var(--pink); }
  .line.blank { height: 0.55em; }
  .cursor {
    display: inline-block;
    width: 10px;
    height: 1.1em;
    background: var(--green);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .progress {
    flex: 1;
    min-width: 180px;
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress > i {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--green));
    transition: width 0.2s linear;
  }
  button {
    appearance: none;
    border: 1px solid var(--cyan);
    background: transparent;
    color: var(--cyan);
    font: inherit;
    font-size: 15px;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
  }
  button:hover { background: rgba(92,200,255,0.12); }
  .footer {
    margin-top: 14px;
    text-align: center;
    color: var(--dim);
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="titlebar">
      <h1>AgentID</h1>
      <div class="sub">On-chain Agent Identity &amp; Reputation Registry · Monad Metropolis<br/>Trust / Identity &amp; AI Infrastructure · Jimmy Wang</div>
      <div class="badge">MOCK REGISTRY — NO CHAIN DEPLOY</div>
    </div>

    <div class="terminal" id="terminal">
      <div class="chrome">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="path">~/AgentID · npm run demo</span>
      </div>
      <div class="screen" id="screen" aria-live="polite"></div>
    </div>

    <div class="controls">
      <div class="progress" aria-hidden="true"><i id="bar"></i></div>
      <button type="button" id="replay">▶ Replay</button>
    </div>
    <div class="footer">register → attest → getReputation · ~60s autoplay · github.com/JimmyWangJimmy/AgentID</div>
  </div>

<script>
const DEMO_LINES = [
  { t: 0.5,  cls: "banner", text: "================================================================" },
  { t: 0.7,  cls: "header", text: "  AgentID — Mock registry (in-memory)" },
  { t: 0.9,  cls: "banner", text: "================================================================" },
  { t: 1.2,  cls: "meta",   text: "  Track: Trust / Identity & AI Infrastructure (Monad Metropolis)" },
  { t: 1.5,  cls: "hl",     text: "  Mode:  MOCK — no chain deploy required" },
  { t: 1.8,  cls: "meta",   text: "  Policy: attestation score 1–5; reputation = sum of scores" },
  { t: 2.1,  cls: "meta",   text: "  Author: Jimmy Wang" },
  { t: 2.6,  cls: "blank",  text: "" },

  { t: 3.0,  cls: "banner", text: "================================================================" },
  { t: 3.2,  cls: "header", text: "  1) registerAgent" },
  { t: 3.4,  cls: "banner", text: "================================================================" },
  { t: 4.0,  cls: "key",    text: "  owner:       0xOwner111111111111111111111111111111111111" },
  { t: 5.0,  cls: "key",    text: "  metadataURI: ipfs://QmAgentMetaDemo001" },
  { t: 6.5,  cls: "ok",     text: "  → agentId:   1" },
  { t: 7.5,  cls: "ok",     text: "  → ownerOf:   0xOwner111111111111111111111111111111111111" },
  { t: 8.5,  cls: "ok",     text: "  → totalAgents: 1" },
  { t: 9.2,  cls: "blank",  text: "" },

  { t: 10.0, cls: "banner", text: "================================================================" },
  { t: 10.2, cls: "header", text: "  2) attest (second wallet)" },
  { t: 10.4, cls: "banner", text: "================================================================" },
  { t: 11.0, cls: "key",    text: "  attester:    0xAttester2222222222222222222222222222222222" },
  { t: 12.0, cls: "key",    text: "  agentId:     1" },
  { t: 13.0, cls: "hl",     text: "  score:       5  (clamp 1–5)" },
  { t: 14.0, cls: "pink",   text: "  tag:         reliable" },
  { t: 15.0, cls: "key",    text: "  evidenceURI: ipfs://QmEvidenceDemo001" },
  { t: 17.0, cls: "ok",     text: "  → attestationCount: 1" },
  { t: 18.0, cls: "blank",  text: "" },

  { t: 20.0, cls: "banner", text: "================================================================" },
  { t: 20.2, cls: "header", text: "  3) getReputation" },
  { t: 20.4, cls: "banner", text: "================================================================" },
  { t: 21.0, cls: "key",    text: "  agentId:     1" },
  { t: 22.0, cls: "key",    text: "  owner:       0xOwner111111111111111111111111111111111111" },
  { t: 23.0, cls: "key",    text: "  metadataURI: ipfs://QmAgentMetaDemo001" },
  { t: 25.0, cls: "ok",     text: "  → score:     5" },
  { t: 26.5, cls: "ok",     text: "  → count:     1" },
  { t: 28.0, cls: "blank",  text: "" },

  { t: 30.0, cls: "banner", text: "================================================================" },
  { t: 30.3, cls: "header", text: "  Done — register → attest → score" },
  { t: 30.6, cls: "banner", text: "================================================================" },
  { t: 32.0, cls: "ok",     text: "  Portable trust in one call. That's AgentID." },
  { t: 34.0, cls: "meta",   text: "  Solidity interfaces: contracts/IAgentRegistry.sol" },
  { t: 35.5, cls: "meta",   text: "  Implementation sketch: contracts/AgentRegistry.sol" },
  { t: 38.0, cls: "blank",  text: "" },
  { t: 40.0, cls: "hl",     text: "  ★ MOCK registry demo complete · Metropolis Trust/Identity" },
  { t: 42.0, cls: "meta",   text: "  github.com/JimmyWangJimmy/AgentID" },
];

const TOTAL_MS = 55000;
const screen = document.getElementById("screen");
const bar = document.getElementById("bar");
const replayBtn = document.getElementById("replay");

let timers = [];
let raf = null;
let startAt = 0;

function clearAll() {
  timers.forEach(clearTimeout);
  timers = [];
  if (raf) cancelAnimationFrame(raf);
  screen.innerHTML = "";
  bar.style.width = "0%";
}

function addLine(cls, text) {
  const div = document.createElement("div");
  div.className = "line " + cls;
  if (cls === "blank") {
    div.innerHTML = "&nbsp;";
  } else {
    div.textContent = text;
  }
  screen.appendChild(div);
  requestAnimationFrame(() => div.classList.add("show"));
  screen.parentElement.scrollTop = screen.parentElement.scrollHeight;
}

function tickProgress() {
  const elapsed = Date.now() - startAt;
  const pct = Math.min(100, (elapsed / TOTAL_MS) * 100);
  bar.style.width = pct + "%";
  if (elapsed < TOTAL_MS) {
    raf = requestAnimationFrame(tickProgress);
  }
}

function play() {
  clearAll();
  startAt = Date.now();
  tickProgress();

  // title pause — empty terminal with cursor for a beat
  const cursorLine = document.createElement("div");
  cursorLine.className = "line show";
  cursorLine.innerHTML = '<span style="color:#8b9bb0">$ npm run demo</span><span class="cursor"></span>';
  screen.appendChild(cursorLine);

  DEMO_LINES.forEach((row) => {
    const id = setTimeout(() => {
      // remove cursor line once output starts
      if (cursorLine.parentNode && row.t >= 0.5) {
        cursorLine.remove();
      }
      addLine(row.cls, row.text);
    }, row.t * 1000);
    timers.push(id);
  });

  // hold final frame until TOTAL_MS
  timers.push(setTimeout(() => {
    bar.style.width = "100%";
  }, TOTAL_MS));
}

replayBtn.addEventListener("click", play);
play();
</script>
</body>
</html>
